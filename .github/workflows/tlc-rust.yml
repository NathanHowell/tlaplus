name: TLC Rust Check-All

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/dev/**'
      - 'specs/001-rewrite-tlc/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/tlc-rust.yml'
  workflow_dispatch: {}

jobs:
  check-all:
    name: TLC Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust 1.91.0 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run TLC rust verification workflow
        run: scripts/dev/check-all.sh
