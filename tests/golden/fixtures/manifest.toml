# TLC parity regression manifest
# Documented list of specifications exercised by the `tlc-parity` harness
# together with their expected legacy behaviors. The harness will evolve to
# consume this metadata once spec ingestion (T024) and per-spec configuration
# plumbing are in place.

[suite]
version = 1
legacy_release = "TLA+ Tools 1.8.0 (TLC 2.18.0, Java 17)"
description = "Curated regression manifest for the Rust TLC parity harness."
notes = "Paths are relative to tests/golden/. Specs marked pending track follow-up tasks before they can run in automation."

[[spec]]
slug = "diehard_violation"
display = "DieHard"
status = "active"
relative_path = "../regression-suite/DieHard"
modules = ["DieHard.tla"]
config = "DieHard.cfg"
origin = "tlatools/org.lamport.tlatools/test-model/DieHard.tla"
tags = ["counterexample", "pluscal", "safety"]
[spec.expectation]
outcome = "violation"
exit_code = 2
legacy_trace = "MC.out"
notes = "Legacy TLC produces a counterexample violating Inv (big bucket reaches 4). Ensures trace parity and exit code 2 propagation."

[[spec]]
slug = "two_phase_commit_symmetry"
display = "TwoPhaseCommit"
status = "active"
relative_path = "../regression-suite/TwoPhaseCommit"
modules = ["TwoPhaseCommit.tla", "MC.tla", "DistributedCommit.tla"]
config = "MC.cfg"
origin = "tlatools/org.lamport.tlatools/test-model/symmetry/TwoPhaseCommit"
tags = ["safety", "liveness", "symmetry"]
[spec.expectation]
outcome = "success"
exit_code = 0
legacy_report = "MC.out"
notes = "Exercises symmetry reduction, multiple invariants, and liveness obligations; legacy TLC completes without violations."

